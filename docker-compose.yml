version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - playstore_data:/app/data
    restart: unless-stopped
    command: ["python", "-c", "from playstorE import main; main.run()"]

volumes:
  playstore_data:
